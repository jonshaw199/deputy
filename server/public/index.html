<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deputy</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img src="/icon.svg" class="logo" alt="" />
      <div>
        <h1>Deputy</h1>
        <div class="tag">keeping the peace in your backlog</div>
      </div>
    </div>
    <div class="muted"><span id="globalDot" class="dot"></span> <span id="updated">loading…</span></div>
  </header>

  <main>
    <section>
      <div class="section-head">
        <h2>Deputies</h2>
        <form id="startForm" class="start">
          <select id="repoSelect"><option value="">Deputize a repo…</option></select>
          <button type="submit">Deputize</button>
        </form>
      </div>
      <div id="daemons" class="cards"></div>
    </section>
  </main>

  <div id="logModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span id="logTitle"></span>
        <button id="logClose">✕</button>
      </div>
      <div class="modal-panes">
        <div class="pane pane-left">
          <div class="pane-label">Activity</div>
          <pre id="logBody"></pre>
          <form id="logReply" class="reply hidden">
            <input id="replyInput" placeholder="reply to this agent…" autocomplete="off" />
            <button type="button" id="letDecide" class="ghost hidden" title="Resume and let the deputy decide for itself">let it decide</button>
            <button type="button" id="addressAll" class="ghost hidden" title="Fix every unresolved review comment on this PR">address all</button>
            <button type="submit">Send</button>
          </form>
        </div>
        <aside id="logDetails" class="pane pane-right hidden"></aside>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>

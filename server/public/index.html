<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deputy</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1><img src="/icon.svg" class="logo" alt="" /> Deputy</h1>
    <div class="muted"><span id="globalDot" class="dot"></span> <span id="updated">loading…</span></div>
  </header>

  <main>
    <section>
      <div class="section-head">
        <h2>Daemons</h2>
        <form id="startForm" class="start">
          <select id="repoSelect"><option value="">Start a daemon…</option></select>
          <button type="submit">Start</button>
        </form>
      </div>
      <div id="daemons" class="cards"></div>
    </section>

    <section>
      <h2>Active work</h2>
      <div id="active" class="cards"></div>
    </section>
  </main>

  <div id="logModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span id="logTitle"></span>
        <button id="logClose">✕</button>
      </div>
      <pre id="logBody"></pre>
      <form id="logReply" class="reply hidden">
        <input id="replyInput" placeholder="reply to this agent…" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
